<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Pi Chat</h1>
      <input id="search" type="search" placeholder="Filter sessions" autocomplete="off">
      <ul id="session-list" title="Click to select, Ctrl+click to add, drag to select many, Ctrl+A for all"></ul>
      <footer id="sidebar-footer">
        <button id="delete-selected-btn" type="button" hidden>Delete</button>
        <button id="new-session-btn" type="button">New session</button>
        <button id="refresh-btn" type="button">Refresh</button>
      </footer>
    </aside>
    <main id="main">
      <div id="empty-state">
        <div class="empty-title">Pi Chat</div>
        <div id="empty-summary" class="empty-summary"></div>
        <button id="empty-new-btn" type="button">New session</button>
        <div class="empty-tips">
          <div>Enter sends · Shift+Enter adds a newline</div>
          <div>Ctrl+click multi-select · drag to select many</div>
          <div>Click a selected session to deselect</div>
        </div>
      </div>
      <div id="chat-row">
        <div id="chat" hidden>
          <header id="chat-header">
            <div id="chat-title-row">
              <span id="chat-name"></span>
              <span id="chat-cwd"></span>
              <span id="chat-model"></span>
              <button id="tool-panel-toggle" type="button">Hide tools</button>
            </div>
            <div id="chat-status-row">
              <select id="model-select" title="Change model"><option value="">Choose model…</option></select>
              <span id="status-dot" class="dot"></span>
              <span id="status-text"></span>
              <button id="stop-btn" type="button">Stop process</button>
            </div>
          </header>
          <div id="messages"></div>
          <div id="command-menu" hidden></div>
          <div id="ext-status-box" hidden></div>
          <div id="ext-widget" hidden></div>
          <footer id="input-bar">
            <textarea id="input" rows="2"
              placeholder="Send a message to Pi. / lists commands. Enter sends, Shift+Enter adds a newline."></textarea>
            <div id="input-buttons">
              <button id="send-btn" type="button">Send</button>
              <button id="stop-run-btn" type="button" hidden>Stop</button>
            </div>
          </footer>
        </div>
        <aside id="tool-panel" hidden>
          <header id="tool-panel-header">
            <span id="tool-panel-title">Tool calls</span>
            <button id="tool-panel-close" type="button" title="Hide tool calls">✕</button>
          </header>
          <div id="tool-panel-body"></div>
        </aside>
      </div>
    </main>
  </div>
  <div id="ext-dialog-backdrop" hidden>
    <div id="ext-dialog">
      <div id="ext-dialog-title"></div>
      <div id="ext-dialog-body"></div>
      <div id="ext-dialog-actions"></div>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
